<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sifat Earning Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b0b0b; color: white; margin: 0; text-align: center; padding-bottom: 80px; }
        .header { padding: 30px 20px; background: #1a1a1a; border-bottom: 3px solid #f39c12; }
        #balance { font-size: 3.5em; color: #f39c12; font-weight: bold; }
        .container { padding: 15px; }
        .task-card { background: #161616; margin: 12px 0; padding: 18px; border-radius: 15px; border: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .btn { background: #f39c12; color: black; border: none; padding: 10px 18px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .ad-space { background: #222; margin: 15px 0; padding: 10px; border-radius: 10px; border: 1px solid #444; color: #888; font-size: 12px; }
        .nav { position: fixed; bottom: 0; width: 100%; background: #111; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #222; }
    </style>
</head>
<body>
    <div class="header">
        <div style="color: #888; font-size: 0.9em;">TOTAL EARNING</div>
        <div id="balance">0</div>
        <div style="color: #f39c12;">Coins</div>
    </div>

    <div class="container">
        <div class="ad-space">
            <p>ADVERTISEMENT</p>
            </div>

        <div class="task-card">
            <div style="text-align: left;"><b>Daily Bonus</b><br><small style="color:#f39c12;">+50 Points</small></div>
            <button class="btn" onclick="addPoints(50, 'Daily Reward')">Claim</button>
        </div>

        <div class="task-card" style="border-left: 4px solid #0088cc;">
            <div style="text-align: left;"><b>Watch Video Ads</b><br><small style="color:#0088cc;">+100 Points</small></div>
            <button class="btn" style="background:#0088cc; color:white;" onclick="watchAd()">Watch</button>
        </div>

        <div class="task-card" style="border-left: 4px solid #2ecc71;">
            <div style="text-align: left;"><b>Withdraw Money</b><br><small style="color:#2ecc71;">Bikash/Nagad</small></div>
            <button class="btn" style="background:#2ecc71; color:white;" onclick="showWithdraw()">Withdraw</button>
        </div>
    </div>

    <nav class="nav">
        <a href="#" style="color:#f39c12; text-decoration:none;"><i class="fas fa-home"></i><br>Home</a>
        <a href="https://t.me/Referincome6427" style="color:#888; text-decoration:none;"><i class="fas fa-headset"></i><br>Support</a>
    </nav>

    <script>
        let bal = parseInt(localStorage.getItem('sifat_bal')) || 0;
        document.getElementById('balance').innerText = bal;

        function addPoints(n, msg) {
            bal += n;
            saveData();
            alert(msg + " Successful!");
        }

        function watchAd() {
            alert("Loading Ad...");
            // এখানে অ্যাড নেটওয়ার্কের কোড কাজ করবে
            setTimeout(() => {
                addPoints(100, "Ad View Reward");
            }, 5000);
        }

        function showWithdraw() {
            if(bal < 5000) {
                alert("আপনার কমপক্ষে ৫০০০ কয়েন প্রয়োজন। বর্তমানে আপনার আছে: " + bal);
            } else {
                let number = prompt("বিকাশ বা নগদ নম্বর দিন:");
                let amount = prompt("কত কয়েন তুলতে চান?");
                if(number && amount) {
                    alert("আপনার পেমেন্ট রিকোয়েস্টটি আমাদের কাছে পৌঁছেছে। ২৪ ঘণ্টার মধ্যে পেমেন্ট পাবেন।");
                    // এখানে টেলিগ্রাম বটের মাধ্যমে আপনাকে মেসেজ পাঠানোর সিস্টেম করা যায়
                }
            }
        }

        function saveData() {
            localStorage.setItem('sifat_bal', bal);
            document.getElementById('balance').innerText = bal;
        }
        window.Telegram.WebApp.expand();
    </script>
</body>
</html>
