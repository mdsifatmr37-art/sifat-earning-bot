<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sifat Earning App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            width: 80%;
        }
        h1 { color: #0088cc; }
        .balance { font-size: 24px; font-weight: bold; margin: 20px 0; }
        button {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sifat Earning App</h1>
        <div class="balance">Balance: <span id="points">0</span> Points</div>
        <button onclick="earnPoints()">Click to Earn</button>
    </div>

    <script>
        let points = 0;
        function earnPoints() {
            points += 10;
            document.getElementById('points').innerText = points;
            Telegram.WebApp.showAlert("Congratulations! You earned 10 points.");
        }
        Telegram.WebApp.ready();
    </script>
</body>
</html>
