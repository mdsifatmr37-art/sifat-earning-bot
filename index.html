<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sifat MR Earning App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff00cc;
            --secondary: #3333ff;
            --bg: #0d0128;
            --card: #1a1a2e;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg);
            color: white;
            margin: 0;
            padding-bottom: 80px;
            overflow-x: hidden;
        }
        .page { display: none; padding: 20px; animation: fadeIn 0.4s; }
        .active-page { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Balance Card */
        .balance-card {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        /* Form Styling */
        .input-group {
            background: var(--card);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #333;
        }
        label { display: block; margin-top: 15px; font-size: 14px; color: #ccc; }
        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border-radius: 10px;
            border: none;
            background: #0d0128;
            color: white;
            box-sizing: border-box;
            outline: none;
        }
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(to right, #ff00cc, #3333ff);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            margin-top: 25px;
            cursor: pointer;
            font-size: 16px;
        }

        /* Navigation Bar */
        .nav-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: #111;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-top: 1px solid #333;
        }
        .nav-link {
            color: #666;
            font-size: 12px;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
        }
        .nav-link.active { color: var(--primary); }
        
        /* History Items */
        .history-item {
            background: var(--card);
            padding: 15px;
            border-radius: 12px;
            margin-top: 10px;
            border-left: 4px solid #ffcc00;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <div id="wallet" class="page active-page">
        <h2 style="text-align:center;">Withdraw Funds</h2>
        
        <div class="balance-card">
            <small>Current Wallet Balance</small>
            <h1 id="mainBal">$54.50</h1>
        </div>

        <div class="input-group">
            <label><i class="fas fa-university"></i> Payment Method:</label>
            <select id="method">
                <option value="BKash">BKash (বিকাশ)</option>
                <option value="Nagad">Nagad (নগদ)</option>
            </select>

            <label><i class="fas fa-phone"></i> Account Number:</label>
            <input type="number" id="accountNumber" placeholder="017XXXXXXXX">

            <label><i class="fas fa-dollar-sign"></i> Amount (Minimum $40):</label>
            <input type="number" id="withdrawAmount" placeholder="Enter Amount (e.g. 40)">

            <button class="submit-btn" onclick="sendWithdrawRequest()">Confirm Withdraw</button>
        </div>

        <h4 style="margin-top:30px;">Transaction History</h4>
        <div id="paymentHistory">
            <p id="noHistory" style="color:#666; text-align:center;">No recent transactions.</p>
        </div>
    </div>

    <nav class="nav-bar">
        <div class="nav-link" onclick="location.reload()"><i class="fas fa-home fa-lg"></i><br>Home</div>
        <div class="nav-link active"><i class="fas fa-wallet fa-lg"></i><br>Wallet</div>
        <div class="nav-link" onclick="alert('Support: @Tech910erning')"><i class="fas fa-headset fa-lg"></i><br>Support</div>
    </nav>

    <script>
        // --- আপনার টেলিগ্রাম সেটিংস ---
        const botToken = "8731805358:AAG_JnStDiGKdzAOk6novNkdKz67yTECcnw"; // আপনার নতুন বটের টোকেন
        const chatId = "@Tech910erning"; // আপনার চ্যানেলের ইউজারনেম
        let balance = 54.50; // ডামি ব্যালেন্স

        function sendWithdrawRequest() {
            const method = document.getElementById('method').value;
            const number = document.getElementById('accountNumber').value;
            const amount = parseFloat(document.getElementById('withdrawAmount').value);

            // ১. ভ্যালিডেশন চেক
            if (isNaN(amount) || amount < 40) {
                alert("দুঃখিত! সর্বনিম্ন ৪০ ডলার উইথড্র দিতে হবে।");
                return;
            }
            if (amount > balance) {
                alert("আপনার একাউন্টে পর্যাপ্ত ব্যালেন্স নেই।");
                return;
            }
            if (number.length < 11) {
                alert("অনুগ্রহ করে একটি সঠিক বিকাশ বা নগদ নাম্বার দিন।");
                return;
            }

            // ২. টেলিগ্রাম নোটিফিকেশন মেসেজ তৈরি
            const message = `🚀 *NEW WITHDRAW REQUEST*\n\n` +
                            `👤 User ID: sifat008\n` +
                            `💰 Amount: $${amount}\n` +
                            `💳 Method: ${method}\n` +
                            `📱 Number: ${number}\n` +
                            `📅 Date: ${new Date().toLocaleString()}\n\n` +
                            `✅ *Status: Pending*`;

            // ৩. টেলিগ্রাম এ মেসেজ পাঠানো (API Call)
            const url = `https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}&parse_mode=Markdown`;

            fetch(url).then(response => {
                if (response.ok) {
                    alert("আপনার উইথড্রো রিকোয়েস্টটি সফলভাবে সাবমিট হয়েছে। আগামী ২৪ থেকে ৪৮ ঘণ্টার মধ্যে পেমেন্ট পেয়ে যাবেন।");
                    
                    // ব্যালেন্স আপডেট
                    balance -= amount;
                    document.getElementById('mainBal').innerText = `$${balance.toFixed(2)}`;

                    // হিস্ট্রি আপডেট
                    addHistory(amount, method, number);
                } else {
                    alert("এরর: বটটি আপনার চ্যানেলে অ্যাডমিন আছে কিনা চেক করুন।");
                }
            }).catch(err => {
                alert("ইন্টারনেট কানেকশন চেক করুন।");
            });
        }

        function addHistory(amt, meth, num) {
            const historyDiv = document.getElementById('paymentHistory');
            document.getElementById('noHistory').style.display = 'none';
            const item = `
                <div class="history-item">
                    <div>
                        <strong>$${amt.toFixed(2)} (${meth})</strong><br>
                        <small style="color:#aaa;">Target: ${num}</small>
                    </div>
                    <span style="color:#ffcc00; font-weight:bold;">Pending</span>
                </div>
            `;
            historyDiv.innerHTML = item + historyDiv.innerHTML;
        }
    </script>

</body>
</html>
