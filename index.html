<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sifat Payment App</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d0128;
            color: white;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .balance-card {
            background: linear-gradient(to right, #ff00cc, #3333ff);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 20px;
        }
        .input-group {
            background: #1a1a2e;
            padding: 20px;
            border-radius: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-top: 10px;
            color: #ccc;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border-radius: 10px;
            border: none;
            background: #0d0128;
            color: white;
            box-sizing: border-box;
        }
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(to right, #ff00cc, #3333ff);
            color: white;
            border: none;
            border-radius: 10px;
            margin-top: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #111;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
        }
        .nav-link {
            color: #666;
            font-size: 12px;
            text-decoration: none;
        }
        .active { color: #ff00cc; }
    </style>
</head>
<body>

    <h2>Withdraw Funds</h2>

    <div class="balance-card">
        <p>Current Wallet Balance</p>
        <h1>$54.50</h1>
    </div>

    <div class="input-group">
        <label><i class="fa-solid fa-building-columns"></i> Payment Method:</label>
        <select id="method">
            <option value="BKash">BKash (বিকাশ)</option>
            <option value="Nagad">Nagad (নগদ)</option>
        </select>

        <label><i class="fa-solid fa-phone"></i> Account Number:</label>
        <input type="number" id="accountNumber" placeholder="017XXXXXXXX">

        <label><i class="fa-solid fa-dollar-sign"></i> Amount (Minimum $40):</label>
        <input type="number" id="withdrawAmount" placeholder="Enter amount">

        <button class="submit-btn" onclick="sendWithdraw()">Confirm Withdraw</button>
    </div>

    <nav class="nav-bar">
        <div class="nav-link"><i class="fa-solid fa-house"></i><br>Home</div>
        <div class="nav-link active"><i class="fa-solid fa-wallet"></i><br>Wallet</div>
        <div class="nav-link"><i class="fa-solid fa-headset"></i><br>Support</div>
    </nav>

    <script>
        const botToken = "8731805358:AAG_JnStDiGKdzAOk6novNkdKz67yTECcnw";
        const chatId = "@Tech910erning";

        function sendWithdraw() {
            const method = document.getElementById('method').value;
            const number = document.getElementById('accountNumber').value;
            const amount = document.getElementById('withdrawAmount').value;

            if(amount < 40) {
                alert("সর্বনিম্ন ৪০ ডলার লাগবে!");
                return;
            }

            const message = `🚀 NEW WITHDRAW\n💰 Amount: $${amount}\n💳 Method: ${method}\n📱 Number: ${number}`;
            const url = `https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`;

            fetch(url).then(res => {
                if(res.ok) alert("সফল হয়েছে! আপনার চ্যানেলে চেক করুন।");
            });
        }
    </script>
</body>
</html>
