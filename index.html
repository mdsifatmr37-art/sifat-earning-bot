<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sifat MR Earning App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-gradient: linear-gradient(135deg, #ff00cc, #3333ff); --card-bg: #ffffff1a; }
        body { font-family: 'Poppins', sans-serif; background-color: #0d0128; color: white; margin: 0; overflow-x: hidden; }
        
        /* Profile Header */
        .header { padding: 20px; display: flex; align-items: center; gap: 15px; }
        .profile-img { width: 60px; height: 60px; border-radius: 50%; border: 2px solid #ff00cc; padding: 2px; }
        .user-info h2 { margin: 0; font-size: 18px; }
        .verified { color: #00f2fe; font-size: 14px; }

        /* Balance Card */
        .balance-card {
            background: var(--primary-gradient);
            margin: 0 20px; padding: 25px; border-radius: 25px;
            text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .balance-amount { font-size: 40px; font-weight: bold; margin: 10px 0; }
        .btn-group { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }
        .main-btn { background: #ffffff33; border: none; padding: 10px 20px; border-radius: 30px; color: white; font-weight: bold; cursor: pointer; backdrop-filter: blur(5px); }

        /* Grid System */
        .work-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 15px; padding: 20px;
        }
        .work-item {
            background: var(--card-bg); padding: 20px 10px;
            border-radius: 15px; text-align: center;
            border: 1px solid #ffffff1a; transition: 0.3s;
        }
        .work-item i { font-size: 24px; margin-bottom: 10px; display: block; }
        .work-item span { font-size: 12px; font-weight: 500; }
        .facebook { color: #1877f2; } .youtube { color: #ff0000; } .telegram { color: #0088cc; } .tiktok { color: #010101; background: white; border-radius: 5px; padding: 2px; }

        /* Bottom Nav */
        .nav-bar {
            position: fixed; bottom: 0; width: 100%;
            background: #1a1a2e; display: flex;
            justify-content: space-around; padding: 15px 0;
            border-top: 1px solid #333;
        }
        .nav-link { color: #888; text-decoration: none; font-size: 12px; text-align: center; }
        .nav-link.active { color: #ff00cc; }
        .center-btn {
            background: #ff00cc; width: 55px; height: 55px;
            border-radius: 50%; display: flex; align-items: center;
            justify-content: center; margin-top: -35px; border: 5px solid #0d0128;
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="https://i.ibb.co/vz6K2Yv/avatar.png" class="profile-img">
        <div class="user-info">
            <h2>Welcome, sifat008 <i class="fas fa-check-circle verified"></i></h2>
        </div>
    </div>

    <div class="balance-card">
        <div style="font-size: 14px; opacity: 0.8;">Available Balance</div>
        <div class="balance-amount">$<span id="userBalance">54.50</span> <small style="font-size: 16px;">USD</small></div>
        <div class="btn-group">
            <button class="main-btn">🎁 Bonus</button>
            <button class="main-btn">💳 Withdraw</button>
        </div>
    </div>

    <div style="padding: 10px 20px; display: flex; justify-content: space-between; font-size: 13px; font-weight: bold;">
        <span><i class="fas fa-briefcase"></i> Commission</span>
        <span style="color: #ff00cc;"><i class="fas fa-sync"></i> Spin & Win</span>
    </div>

    <div class="work-grid">
        <div class="work-item" onclick="alert('Facebook Work Loading...')">
            <i class="fab fa-facebook facebook"></i>
            <span>Facebook Work</span>
        </div>
        <div class="work-item">
            <i class="fas fa-globe telegram"></i>
            <span>Otoeb</span>
        </div>
        <div class="work-item">
            <i class="fab fa-telegram telegram"></i>
            <span>Telegram</span>
        </div>
        <div class="work-item">
            <i class="fab fa-tiktok tiktok"></i>
            <span>Tiktok Work</span>
        </div>
        <div class="work-item">
            <i class="fab fa-youtube youtube"></i>
            <span>Youtube</span>
        </div>
        <div class="work-item">
            <i class="fas fa-calendar-check" style="color: #f39c12;"></i>
            <span>Daily Bonus</span>
        </div>
        <div class="work-item">
            <i class="fas fa-poll" style="color: #2ecc71;"></i>
            <span>Surveys</span>
        </div>
        <div class="work-item">
            <i class="fas fa-robot" style="color: #9b59b6;"></i>
            <span>AI Bot</span>
        </div>
        <div class="work-item">
            <i class="fas fa-users" style="color: #34495e;"></i>
            <span>Refer</span>
        </div>
    </div>

    <nav class="nav-bar">
        <a href="#" class="nav-link active"><i class="fas fa-home"></i><br>Home</a>
        <a href="#" class="nav-link"><i class="fas fa-store"></i><br>Shop</a>
        <div class="center-btn"><i class="fas fa-wallet" style="color: white; font-size: 20px;"></i></div>
        <a href="#" class="nav-link"><i class="fas fa-headset"></i><br>Support</a>
        <a href="#" class="nav-link"><i class="fas fa-user"></i><br>Profile</a>
    </nav>

</body>
</html>
