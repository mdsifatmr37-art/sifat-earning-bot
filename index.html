<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="monetag" content="eb922bf06617e26d839713d2cdd86ad7">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sifat Earning Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="//libtl.com/sdk.js" data-zone="10971120" data-sdk="show_10971120"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b0b0b; color: white; margin: 0; text-align: center; padding-bottom: 70px; }
        .header { padding: 30px 20px; background: #1a1a1a; border-bottom: 3px solid #f39c12; }
        #balance { font-size: 3.5em; color: #f39c12; font-weight: bold; margin: 10px 0; }
        .container { padding: 15px; }
        .task-card { background: #161616; margin: 12px 0; padding: 18px; border-radius: 15px; border: 1px solid #333; text-align: left; }
        .btn { background: #f39c12; color: black; border: none; padding: 10px 18px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .ad-space { background: #222; margin: 15px 0; padding: 10px; border-radius: 10px; border: 1px dashed #444; color: #888; }
        .nav { position: fixed; bottom: 0; width: 100%; background: #111; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #333; }
        .nav a { color: #f39c12; text-decoration: none; font-size: 0.8em; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; background: #333; color: white; border: none; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="header">
    <div style="color: #888; font-size: 0.9em;">TOTAL EARNING</div>
    <div id="balance">0</div>
    <div style="color: #f39c12;">Coins</div>
</div>

<div class="container">
    <div class="ad-space">
        <p>ADVERTISEMENT</p>
    </div>

    <div class="task-card">
        <b>Daily Bonus</b><br><small style="color:#f39c12;">+50 Points</small><br>
        <button class="btn" onclick="addPoints(50, 'Daily Reward')">Claim</button>
    </div>

    <div class="task-card" style="border-left: 4px solid #0088cc;">
        <b>Watch Video Ads</b><br><small style="color:#0088cc;">+100 Points</small><br>
        <button class="btn" style="background:#0088cc; color:white;" onclick="watchAd()">Watch</button>
    </div>

    <div class="task-card" style="border-left: 4px solid #2ecc71;">
        <h3>Withdraw Money</h3>
        <select id="method">
            <option value="Bkash">Bkash (বিকাশ)</option>
            <option value="Nagad">Nagad (নগদ)</option>
            <option value="Rocket">Rocket (রকেট)</option>
        </select>
        <input type="number" id="phone" placeholder="017XXXXXXXX">
        <input type="number" id="amount" placeholder="Min 5000 Coins">
        <button class="btn" style="background:#2ecc71; color:white; width:100%;" onclick="submitWithdraw()">Submit Withdraw</button>
    </div>
</div>

<nav class="nav">
    <a href="#"><i class="fas fa-home"></i><br>Home</a>
    <a href="https://t.me/Referincome6427"><i class="fas fa-headset"></i><br>Support</a>
</nav>

<script>
    let bal = parseInt(localStorage.getItem('sifat_bal')) || 0;
    document.getElementById('balance').innerText = bal;

    function saveData() {
        localStorage.setItem('sifat_bal', bal);
        document.getElementById('balance').innerText = bal;
    }

    function addPoints(n, msg) {
        if (msg === "Daily Reward") {
            let lastClaim = localStorage.getItem('lastClaimDate');
            let today = new Date().toDateString();
            if (lastClaim === today) {
                alert("দুঃখিত! আপনি আজ বোনাস নিয়েছেন। আগামীকাল আবার চেষ্টা করুন।");
                return;
            }
            localStorage.setItem('lastClaimDate', today);
        }
        bal += n;
        saveData();
        alert(msg + " সফল হয়েছে!");
    }

    function watchAd() {
        alert("বিজ্ঞাপন লোড হচ্ছে...");
        // Monetag SmartLink
        window.open('https://omg10.com/4/10971246', '_blank'); 
        setTimeout(() => {
            addPoints(100, "Ad View Reward");
        }, 5000); 
    }

    function submitWithdraw() {
        const method = document.getElementById('method').value;
        const phone = document.getElementById('phone').value;
        const amount = document.getElementById('amount').value;

        if (bal < 5000) {
            alert("আপনার কমপক্ষে ৫০০০ পয়েন্ট প্রয়োজন। বর্তমানে আছে: " + bal);
            return;
        }
        if (phone.length < 11 || amount < 5000) {
            alert("সঠিক নম্বর এবং কমপক্ষে ৫০০০ পয়েন্ট লিখুন।");
            return;
        }

        alert("সফল হয়েছে!\n" + amount + " কয়েন রিলেয়েস্টটি পেন্ডিং আছে। ২৪ ঘণ্টার মধ্যে পেমেন্ট পাবেন।");
        bal -= parseInt(amount);
        saveData();
    }

    window.Telegram.WebApp.expand();
</script>

</body>
</html>
