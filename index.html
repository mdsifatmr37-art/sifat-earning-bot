<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sifat MR Earning App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #ff00cc; --secondary: #3333ff; --bg: #0d0128; --card: #1a1a2e; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: white; margin: 0; overflow-x: hidden; }
        .page { display: none; padding-bottom: 100px; animation: fadeIn 0.3s; }
        .active-page { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .header { padding: 25px 20px; text-align: center; }
        .balance-card {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            margin: 0 20px; padding: 30px; border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); position: relative;
        }
        .balance-amount { font-size: 45px; font-weight: bold; margin: 5px 0; }

        .container { padding: 20px; }
        .task-item {
            background: var(--card); padding: 15px; border-radius: 15px;
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 12px; border: 1px solid #ffffff1a; transition: 0.2s; cursor: pointer;
        }
        .icon-box { width: 45px; height: 45px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }

        .btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white; border: none; padding: 15px; width: 100%;
            border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px;
        }

        .nav-bar {
            position: fixed; bottom: 0; width: 100%; background: #161625;
            display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #333;
        }
        .nav-link { color: #888; text-decoration: none; font-size: 11px; text-align: center; cursor: pointer; }
        .nav-link.active { color: var(--primary); }
        .nav-link i { font-size: 20px; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div id="home" class="page active-page">
        <div class="header">
            <h2 style="margin:0;">Sifat MR Earning</h2>
        </div>
        <div class="balance-card">
            <small style="opacity:0.8;">Balance</small>
            <div class="balance-amount">$<span id="mainBalance">2.00</span></div>
            <button class="btn" onclick="showPage('task')">Start Earning</button>
        </div>
    </div>

    <div id="task" class="page">
        <div class="header"><h3>Task Center</h3></div>
        <div class="container">
            <div class="task-item" onclick="watchAd()">
                <div style="display:flex; align-items:center; gap:15px;">
                    <div class="icon-box" style="background: #f39c12;"><i class="fas fa-play"></i></div>
                    <div><b>Watch Video Ads</b><br><small>Click to Earn $0.04</small></div>
                </div>
                <b style="color: #2ecc71;">$0.04</b>
            </div>
        </div>
    </div>

    <nav class="nav-bar">
        <div class="nav-link active" onclick="showPage('home', this)"><i class="fas fa-home"></i><br>Home</div>
        <div class="nav-link" onclick="showPage('task', this)"><i class="fas fa-tasks"></i><br>Work</div>
    </nav>

    <script>
        let balance = 2.00;

        function showPage(pageId, element) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.getElementById(pageId).classList.add('active-page');
            if(element) {
                document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
                element.classList.add('active');
            }
        }

        function updateBalance() {
            document.getElementById('mainBalance').innerText = balance.toFixed(2);
        }

        function watchAd() {
            // আপনার Monetag Direct Link ID 10979048 এখানে সেট করা হয়েছে
            window.location.href = "https://prmnode.com/pfe/current/tag.min.js?z=10979048"; 
            
            balance += 0.04;
            updateBalance();
            alert("অভিনন্দন! আপনি $0.04 রিওয়ার্ড পেয়েছেন।");
        }
    </script>
</body>
</html>
