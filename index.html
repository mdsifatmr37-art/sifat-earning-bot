<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sifat MR Earning App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src='//whephiac.com/sdk.js' data-zone='10979048' data-sdk='show_10979048'></script>

    <style>
        :root { --primary: #ff00cc; --secondary: #3333ff; --bg: #0d0128; --card: #1a1a2e; }
        body { font-family: Arial, sans-serif; background: var(--bg); color: white; margin: 0; padding-bottom: 70px; }
        
        .page { display: none; padding: 20px; }
        .active-page { display: block; }
        
        /* Header & Balance */
        .balance-card { background: linear-gradient(135deg, var(--primary), var(--secondary)); padding: 30px; border-radius: 20px; text-align: center; margin-bottom: 20px; }
        
        /* Grid Layout */
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .grid-item { background: var(--card); padding: 20px; border-radius: 15px; text-align: center; border: 1px solid #333; cursor: pointer; }
        .grid-item i { font-size: 30px; margin-bottom: 10px; display: block; }
        
        /* Support List */
        .support-item { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; align-items: center; gap: 15px; cursor: pointer; border: 1px solid #222; }

        /* Nav Bar */
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #111; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #333; }
        .nav-link { color: #777; text-align: center; font-size: 12px; cursor: pointer; }
        .active-nav { color: var(--primary); }

        /* Timer Overlay */
        #ad-timer-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="home" class="page active-page">
        <div class="balance-card">
            <small>Total Balance</small>
            <h1 id="main-bal">$2.00</h1>
        </div>
        
        <div class="grid-container">
            <div class="grid-item" onclick="startMonetagAd()">
                <i class="fa-solid fa-rectangle-ad" style="color: #00ff88;"></i>
                <span>Watch Ads</span>
            </div>
            <div class="grid-item" onclick="showPage('support')">
                <i class="fa-solid fa-headset" style="color: var(--primary);"></i>
                <span>Support</span>
            </div>
        </div>
    </div>

    <div id="support" class="page">
        <h2>Support Center</h2>
        <div class="support-item" onclick="window.location.href='https://t.me/Tech910erning'">
            <i class="fa-brands fa-telegram" style="color: #0088cc; font-size: 24px;"></i>
            <span>Support Channel</span>
        </div>
        <div class="support-item" onclick="window.location.href='https://t.me/bdearning2764'">
            <i class="fa-brands fa-telegram" style="color: #0088cc; font-size: 24px;"></i>
            <span>Join Channel</span>
        </div>
        <div class="support-item" onclick="window.location.href='https://www.youtube.com/@ItsMeSifatMr'">
            <i class="fa-brands fa-youtube" style="color: red; font-size: 24px;"></i>
            <span>Subscribe Youtube</span>
        </div>
    </div>

    <div id="ad-timer-overlay">
        <h2 id="timer-text">অ্যাড শুরু হচ্ছে...</h2>
        <p>দয়া করে ১৫ সেকেন্ড অপেক্ষা করুন</p>
    </div>

    <nav class="nav-bar">
        <div class="nav-link active-nav" onclick="showPage('home')"><i class="fa-solid fa-house"></i><br>Home</div>
        <div class="nav-link" onclick="showPage('support')"><i class="fa-solid fa-circle-info"></i><br>Support</div>
    </nav>

    <script>
        let balance = 2.00;

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.getElementById(pageId).classList.add('active-page');
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active-nav'));
        }

        function startMonetagAd() {
            // ১৫ সেকেন্ডের টাইমার মেকানিজম
            let timeLeft = 15;
            const overlay = document.getElementById('ad-timer-overlay');
            const timerText = document.getElementById('timer-text');
            
            overlay.style.display = 'flex';
            
            let timerInterval = setInterval(() => {
                timerText.innerText = `অ্যাড শেষ হতে বাকি: ${timeLeft} সেকেন্ড`;
                timeLeft--;

                if (timeLeft < 0) {
                    clearInterval(timerInterval);
                    overlay.style.display = 'none';
                    
                    // টাইমার শেষ হওয়ার পর Monetag অ্যাড কল করা
                    if (typeof show_10979048 === 'function') {
                        show_10979048().then(() => {
                            addBalance();
                        });
                    } else {
                        // যদি স্ক্রিপ্ট লোড না হয় তবে সরাসরি যোগ হবে (টেস্টের জন্য)
                        addBalance();
                    }
                }
            }, 1000);
        }

        function addBalance() {
            balance += 0.05;
            document.getElementById('main-bal').innerText = `$${balance.toFixed(2)}`;
            alert("অভিনন্দন! ৫ সেন্ট আপনার ব্যালেন্সে যোগ হয়েছে।");
        }
    </script>
</body>
</html>
