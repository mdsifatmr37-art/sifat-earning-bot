<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="monetag" content="eb922bf06617e26d839713d2cdd86ad7">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sifat Earning Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="//libtl.com/sdk.js" data-zone="10971120" data-sdk="show_10971120"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b0b0b; color: white; margin: 0; text-align: center; }
        .page { display: none; padding-bottom: 80px; }
        .active-page { display: block; }
        
        /* Header */
        .header { padding: 30px 20px; background: #1a1a1a; border-bottom: 2px solid #f39c12; margin-bottom: 15px; }
        #balance { font-size: 3em; color: #f39c12; font-weight: bold; }

        /* Content */
        .container { padding: 15px; }
        .card { background: #161616; margin: 12px 0; padding: 20px; border-radius: 15px; border: 1px solid #333; text-align: left; position: relative; }
        .btn { background: #f39c12; color: black; border: none; padding: 12px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; font-size: 16px; }
        
        /* Bottom Nav */
        .nav { position: fixed; bottom: 0; width: 100%; background: #111; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #333; }
        .nav-item { color: #888; text-decoration: none; font-size: 12px; cursor: pointer; }
        .nav-item.active { color: #f39c12; }
        .nav-item i { font-size: 20px; margin-bottom: 5px; }

        /* Input Styles */
        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; background: #222; color: white; border: 1px solid #444; box-sizing: border-box; }
    </style>
</head>
<body>

    <div id="home" class="page active-page">
        <div class="header">
            <div style="color: #888;">MY TOTAL BALANCE</div>
            <div id="balance">0</div>
            <div style="color: #f39c12;">Coins</div>
        </div>
        <div class="container">
            <div class="card">
                <h3 style="margin:0;">Welcome, Sifat MR!</h3>
                <p style="color:#888; font-size: 14px;">বিজ্ঞাপন দেখুন এবং টাকা আয় করুন সরাসরি বিকাশ বা নগদে।</p>
            </div>
            <div class="card" style="border-left: 4px solid #f39c12;">
                <b>Daily Bonus</b><br><small>প্রতিদিন একবার ক্লেইম করুন।</small>
                <button class="btn" onclick="addPoints(50, 'Daily Reward')">Get 50 Coins</button>
            </div>
        </div>
    </div>

    <div id="task" class="page">
        <div class="header"><h3>Work Station</h3></div>
        <div class="container">
            <div class="card" style="border-left: 4px solid #0088cc;">
                <b>Video Ads</b><br><small>আনলিমিটেড বিজ্ঞাপন দেখে আয় করুন।</small>
                <button class="btn" style="background:#0088cc; color:white;" onclick="watchAd()">Watch & Earn 100</button>
            </div>
            <div class="card" style="border-left: 4px solid #9b59b6;">
                <b>Smart Task</b><br><small>Special Ads for you.</small>
                <button class="btn" style="background:#9b59b6; color:white;" onclick="watchAd()">Start Task</button>
            </div>
        </div>
    </div>

    <div id="withdraw" class="page">
        <div class="header"><h3>Payment Method</h3></div>
        <div class="container">
            <div class="card">
                <label>Select Method:</label>
                <select id="method">
                    <option value="Bkash">Bkash (বিকাশ)</option>
                    <option value="Nagad">Nagad (নগদ)</option>
                    <option value="Rocket">Rocket (রকেট)</option>
                </select>
                <input type="number" id="phone" placeholder="Enter Phone Number">
                <input type="number" id="amount" placeholder="Min 5000 Coins">
                <button class="btn" style="background:#2ecc71; color:white;" onclick="submitWithdraw()">Withdraw Now</button>
            </div>
        </div>
    </div>

    <nav class="nav">
        <div class="nav-item active" onclick="showPage('home', this)"><i class="fas fa-home"></i><br>Home</div>
        <div class="nav-item" onclick="showPage('task', this)"><i class="fas fa-tasks"></i><br>Task</div>
        <div class="nav-item" onclick="showPage('withdraw', this)"><i class="fas fa-wallet"></i><br>Withdraw</div>
    </nav>

    <script>
        let bal = parseInt(localStorage.getItem('sifat_bal')) || 0;
        document.getElementById('balance').innerText = bal;

        function showPage(pageId, element) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.getElementById(pageId).classList.add('active-page');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            element.classList.add('active');
        }

        function saveData() {
            localStorage.setItem('sifat_bal', bal);
            document.getElementById('balance').innerText = bal;
        }

        function addPoints(n, msg) {
            if (msg === "Daily Reward") {
                let last = localStorage.getItem('lastClaim');
                if (last === new Date().toDateString()) {
                    alert("আজ অলরেডি নিয়েছেন!"); return;
                }
                localStorage.setItem('lastClaim', new Date().toDateString());
            }
            bal += n;
            saveData();
            alert(msg + " Successful!");
        }

        function watchAd() {
            alert("বিজ্ঞাপন লোড হচ্ছে...");
            window.open('https://omg10.com/4/10971246', '_blank'); 
            setTimeout(() => { addPoints(100, "Ad Reward"); }, 5000); 
        }

        function submitWithdraw() {
            const phone = document.getElementById('phone').value;
            const amt = document.getElementById('amount').value;
            if (bal < 5000 || amt < 5000) { alert("কমপক্ষে ৫০০০ পয়েন্ট লাগবে।"); return; }
            if (phone.length < 11) { alert("সঠিক নম্বর দিন।"); return; }
            alert("অনুরোধ পাঠানো হয়েছে! ২৪ ঘণ্টার মধ্যে পেমেন্ট পাবেন।");
            bal -= parseInt(amt);
            saveData();
        }

        window.Telegram.WebApp.expand();
    </script>
</body>
</html>
